<script src="../../../tools/reel-engine.js"></script><script>const jar='<svg viewBox="0 0 150 190"><rect x="34" y="6" width="82" height="30" rx="8" fill="#3D3B1F"/><rect x="14" y="34" width="122" height="150" rx="30" fill="#D98E04"/><rect x="26" y="50" width="16" height="110" rx="8" fill="#F4B63A" opacity=".8"/><rect x="34" y="84" width="82" height="64" rx="10" fill="#FAF1DC"/><path d="M75 96l17 10v20l-17 10-17-10v-20z" fill="none" stroke="#3D3B1F" stroke-width="6" stroke-linejoin="round"/></svg>';
// element states: [x,y,scale,rot] crowded -> margins -> grouped -> final; out=[dx,dy,rot] for clutter that leaves in step 3
const E=[
 {c:'ti',h:'عسل خلية',p:[[292,4,1,0],[250,50,1,0],[250,56,1,0],[250,60,.95,0]]},
 {c:'tgl',h:'طبيعي 100%',p:[[6,338,1,-7],[50,338,1,-7],[370,172,1,0],[370,170,1,0]]},
 {c:'bd',h:'جديد',bg:'#D98E04',p:[[-26,-26,1,0],[50,50,1,0],[50,50,1,0]],out:[-420,-200,-90]},
 {c:'bd',h:'خصم',bg:'#3D3B1F',p:[[600,236,1,0],[530,250,1,0],[530,250,1,0]],out:[460,-120,80]},
 {c:'bd',h:'توصيل مجاني',bg:'#B4530A',p:[[606,632,1,0],[530,600,1,0],[60,650,1,0]],out:[-480,160,-120]},
 {c:'sd',h:'سدر · زهور · شمع',p:[[-6,560,1,0],[50,560,1,0],[50,560,1,0]],out:[-520,60,-20]},
 {c:'jar',h:jar,p:[[-14,410,1,0],[50,410,1,0],[50,410,1,0]],out:[-460,-80,-70]},
 {c:'jar',h:jar,p:[[130,410,1,0],[170,410,1,0],[170,410,1,0]],out:[-420,260,-110]},
 {c:'jar',h:jar,main:1,p:[[285,410,1,0],[285,410,1,0],[285,410,1,0],[229,285,1.75,0]]},
 {c:'jar',h:jar,p:[[440,410,1,0],[400,410,1,0],[400,410,1,0]],out:[440,240,100]},
 {c:'jar',h:jar,p:[[584,410,1,0],[520,410,1,0],[520,410,1,0]],out:[470,-60,70]},
 {c:'jar',h:jar,p:[[285,216,1,0],[285,222,1,0],[285,222,1,0]],out:[60,-520,40]},
 {c:'pr',h:'4.500 <small>د.ك</small>',p:[[2,806,1,4],[50,770,1,4],[370,676,1,0],[370,676,1,0]]},
 {c:'bt',h:'اطلب الحين',p:[[426,820,1,0],[370,766,1,0],[370,766,1,0],[370,766,1,0]]}];
function build(id){const f=$(id);f.innerHTML=E.map((e,i)=>`<div class="fe ${e.c}" data-i="${i}" style="${e.bg?'background:'+e.bg:''}">${e.h}</div>`).join('')+
 '<div class="ov mg"></div><div class="ov tk" style="left:330px;top:8px">50</div><div class="ov tk" style="left:330px;bottom:8px">50</div><div class="ov tk" style="left:4px;top:430px">50</div><div class="ov tk" style="right:4px;top:430px">50</div>'+
 '<div class="ov gb" style="left:236px;top:46px;width:450px;height:190px"></div><div class="ov gb" style="left:350px;top:662px;width:336px;height:204px"></div>'+
 '<div class="ov th" style="top:300px"></div><div class="ov th" style="top:600px"></div><div class="ov jr"></div>'+
 '<div class="ov sp" style="left:70px;top:150px">فراغ</div><div class="ov sp" style="left:500px;top:640px">فراغ</div>';}
function lay(id,t,m1,m2,m3,dim,jit){const f=$(id);const ov=f.querySelectorAll('.ov');
 f.querySelectorAll('.fe').forEach((el,i)=>{const e=E[i];const p=e.p;const last=p[p.length-1];
  let a=p[0].map((v,k)=>lerp(v,p[1][k],m1));a=a.map((v,k)=>lerp(v,p[2][k],m2));
  let o=1;if(p[3])a=a.map((v,k)=>lerp(v,p[3][k],m3));
  if(e.out){const q=ein(m3);a[0]+=e.out[0]*q;a[1]+=e.out[1]*q;a[3]+=e.out[2]*q;o=1-cl((m3-.55)*2.4);o*=1-.82*dim;}
  if(jit){a[0]+=Math.sin(t*23+i*2.1)*3.2*jit;a[1]+=Math.cos(t*19+i*1.3)*3.2*jit;}
  el.style.opacity=o;el.style.transform=`translate(${a[0]}px,${a[1]}px) rotate(${a[3]}deg) scale(${a[2]})`;el.style.filter=e.out&&m3>0&&m3<1?`blur(${(ein(m3)*8).toFixed(1)}px)`:'';});
 return ov;}

build('flA');build('flB');lay('flB',0,0,0,0,0,0).forEach(o=>o.style.opacity=0);lay('flA',0,1,1,1,0,0).forEach(o=>o.style.opacity=0);function frame(){}</script></body></html>
