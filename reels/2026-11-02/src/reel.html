<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0E0E0E;overflow:hidden}
#s{position:relative;width:1080px;height:1920px;background:#0E0E0E;color:#F2F0EB;font-family:"IBM Plex Sans Arabic";direction:rtl;overflow:hidden}
.n{font-family:"Inter";direction:ltr;unicode-bidi:isolate}
.a{position:absolute}
.sc{position:absolute;inset:0;opacity:0}
.kick{position:absolute;right:80px;top:330px;display:flex;align-items:center;gap:20px;font:500 34px/44px "IBM Plex Sans Arabic";color:#8A8A8A}
.kick .n{font:600 30px/40px Inter;letter-spacing:.12em}
.kick .ln{width:56px;height:2px;background:#3A3A3A}
.chip{position:absolute;border:2px solid #F2F0EB;border-radius:999px;padding:10px 36px;font:600 46px/60px "IBM Plex Sans Arabic";opacity:0}
</style></head><body><div id="s">
<img id="wm" class="a" style="left:80px;top:120px;height:30px">
<div id="cd" class="a n" style="right:80px;top:116px;font:600 34px/40px Inter;color:#8A8A8A;letter-spacing:.06em">0:05</div>
<div id="scan" class="a" style="z-index:5;height:6px;background:#C9A45C;width:0;left:80px;top:0;opacity:0"></div>

<!-- S1 -->
<div id="s1" class="sc">
  <div id="five" class="a n" style="left:0;right:0;top:330px;text-align:center;font:600 980px/900px Inter;letter-spacing:-.04em">5</div>
  <div class="a" style="right:80px;left:80px;top:1330px;text-align:center"><span id="s1t" style="display:inline-block;font:700 150px/180px 'IBM Plex Sans Arabic';clip-path:inset(0 0 0 100%)">ثواني بس.</span></div>
</div>

<!-- S2 -->
<div id="s2" class="sc">
  <div id="s2a" class="a" style="right:80px;left:80px;top:560px;font:700 100px/130px 'IBM Plex Sans Arabic'">الزبون يقرر:</div>
  <div id="s2b" class="a" style="right:80px;left:80px;top:780px;font:700 190px/230px 'IBM Plex Sans Arabic'">يتابعك…</div>
  <div id="s2c" class="a" style="right:80px;left:80px;top:1060px;font:700 190px/230px 'IBM Plex Sans Arabic';color:#5A5A5A">أو يطلع.</div>
</div>

<!-- S3 bio -->
<div id="s3" class="sc">
  <div class="kick"><span class="n">01</span><span class="ln"></span><span>البايو</span></div>
  <div id="bioB" class="a" style="right:80px;left:80px;top:480px"></div>
  <div id="bioA" class="a" style="right:80px;left:80px;top:480px;opacity:0"></div>
  <div id="c1" class="chip" style="right:80px;top:1010px">شنو تبيع؟</div>
  <div id="c2" class="chip" style="right:420px;top:1010px">وين؟</div>
  <div id="c3" class="chip" style="right:80px;top:1130px">شلون أطلب؟</div>
</div>

<!-- S4 avatar -->
<div id="s4" class="sc">
  <div class="kick"><span class="n">02</span><span class="ln"></span><span>صورة البروفايل</span></div>
  <div id="row" class="a" style="right:80px;left:80px;top:860px;height:120px;opacity:0;display:flex;align-items:center;gap:28px">
    <div style="width:120px;flex:none"></div>
    <div><div class="n" style="font:600 40px/50px Inter;text-align:right">loomi.kw</div><div style="font:400 30px/40px 'IBM Plex Sans Arabic';color:#8A8A8A">لومي · عصير فريش</div></div>
  </div>
  <div id="av" class="a" style="width:460px;height:460px;right:310px;top:690px"></div>
  <div id="s4t" class="a" style="right:80px;left:80px;top:1330px;text-align:center;font:700 80px/100px 'IBM Plex Sans Arabic';opacity:0">ما ينقرا.</div>
</div>

<!-- S5 highlights -->
<div id="s5" class="sc">
  <div class="kick"><span class="n">03</span><span class="ln"></span><span>الهايلايتس</span></div>
  <div id="s5t" class="a" style="right:80px;left:80px;top:440px;font:700 84px/110px 'IBM Plex Sans Arabic';opacity:0">مو ألبوم ذكريات.</div>
  <div id="hl" class="a" style="right:80px;left:80px;top:640px;height:820px"></div>
</div>

<!-- S6 -->
<div id="s6" class="sc">
  <div id="s6a" class="a" style="right:80px;left:80px;top:560px;font:500 58px/80px 'IBM Plex Sans Arabic';color:#8A8A8A;opacity:0">إذا وحدة من هالثلاث ناقصة،</div>
  <div id="s6b" class="a" style="right:80px;left:80px;top:720px;font:700 170px/210px 'IBM Plex Sans Arabic'"><span id="w1" style="display:inline-block;opacity:0">الزبون</span> <span id="w2" style="display:inline-block;opacity:0">طلع</span></div>
  <div id="s6c" class="a" style="right:80px;left:80px;top:1010px;font:500 70px/96px 'IBM Plex Sans Arabic';color:#8A8A8A;opacity:0">قبل لا يشوف شغلك.</div>
</div>

<!-- S7 -->
<div id="s7" class="sc">
  <div id="s7a" class="a" style="right:80px;left:80px;top:420px;font:700 120px/150px 'IBM Plex Sans Arabic';opacity:0">خل أول<br>خمس ثواني<br>لك…</div>
  <div id="s7b" class="a" style="right:80px;left:80px;top:960px;font:500 64px/84px 'IBM Plex Sans Arabic';color:#8A8A8A;opacity:0">وأرسل لي</div>
  <div id="s7c" class="a" style="right:80px;left:80px;top:1050px;font:700 150px/190px 'IBM Plex Sans Arabic';opacity:0">«بروفايل»</div>
  <div id="s7d" class="a" style="right:80px;left:80px;top:1270px;font:500 64px/84px 'IBM Plex Sans Arabic';color:#8A8A8A;opacity:0">بالدايركت</div>
</div>

<!-- END -->
<div id="s8" class="sc" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
  <img id="logo" style="width:520px">
  <div class="n" style="font:600 46px/60px Inter;margin-top:48px">@nori.dsgn</div>
  <div style="font:500 40px/56px 'IBM Plex Sans Arabic';color:#8A8A8A;margin-top:12px">النتيجة تتكلم</div>
</div>
</div>
<script>
const GR='#1F4A2C',LI='#A9C94A',CR='#F5F0DC',INK='#16261B';
function mark(sz,bg=GR){let seg='';for(let i=0;i<8;i++){const a=i*Math.PI/4;seg+=`<line x1="50" y1="50" x2="${50+30*Math.cos(a)}" y2="${50+30*Math.sin(a)}" stroke="${CR}" stroke-width="3"/>`}
 return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="${bg}"/><circle cx="50" cy="50" r="34" fill="${LI}"/><circle cx="50" cy="50" r="31" fill="none" stroke="${CR}" stroke-width="2"/>${seg}<circle cx="50" cy="50" r="5" fill="${CR}"/></svg>`}
function messy(sz){return `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:#FFE14D;border:${Math.max(2,sz/40)}px solid #E8327C;display:flex;align-items:center;justify-content:center;overflow:hidden"><div style="font:700 ${sz/9}px/1.15 'IBM Plex Sans Arabic';color:#E8327C;text-align:center">مؤسسة لومي<br>للعصائر الطبيعية<br><span style="font-size:${sz/13}px;color:#1B6DD1">ذ.م.م</span></div></div>`}
function bio(on){const b=on?['<b>لومي · <span class="n">Loomi</span></b>','عصير فريش ينعصر قدامك','الشويخ · كل يوم من <span class="n">8</span> الصبح','اطلب واتساب ↓']:['<b>مؤسسة لومي للعصائر الطبيعية والمشروبات</b>','أهلاً وسهلاً بكم في حسابنا الرسمي','نتمنى لكم يوم سعيد','للتواصل الخاص'];
 return `<div style="background:${on?CR:'#fff'};padding:44px 44px;display:flex;gap:36px;align-items:flex-start">${on?mark(170):messy(170)}<div style="font:400 38px/58px 'IBM Plex Sans Arabic';color:${on?INK:'#111'}">${b.join('<br>')}${on?`<div style="margin-top:18px;display:inline-block;background:${GR};color:${CR};padding:8px 30px;font:600 34px/48px 'IBM Plex Sans Arabic'">اطلب الحين</div>`:`<div class="n" style="margin-top:18px;font:400 30px/48px Inter;color:#1B6DD1;text-align:right">linktr.ee/loomi.kw.official</div>`}</div></div>`}
const ICON={menu:c=>`<rect x="34" y="36" width="32" height="4" fill="${c}"/><rect x="34" y="48" width="32" height="4" fill="${c}"/><rect x="34" y="60" width="22" height="4" fill="${c}"/>`,
price:c=>`<path d="M30 50 L50 30 H70 V50 L50 70 Z" fill="none" stroke="${c}" stroke-width="4" stroke-linejoin="round"/><circle cx="61" cy="39" r="4" fill="${c}"/>`,
bike:c=>`<circle cx="36" cy="60" r="9" fill="none" stroke="${c}" stroke-width="4"/><circle cx="66" cy="60" r="9" fill="none" stroke="${c}" stroke-width="4"/><path d="M36 60 L48 40 H60 L66 60 M48 40 L54 60" fill="none" stroke="${c}" stroke-width="4" stroke-linejoin="round"/>`,
star:c=>`<path d="M50 30 L56 44 L71 45 L59 55 L63 70 L50 62 L37 70 L41 55 L29 45 L44 44 Z" fill="${c}"/>`};
const OLD=[['#FF6B6B','متفرقات'],['#4D96FF','<span class="n">2024</span>'],['#FFD93D','<span class="n">New</span>'],['#6BCB77','صور']];
const NEW=[['menu','المنيو'],['price','الأسعار'],['bike','شلون تطلب'],['star','الآراء']];
let h='';for(let i=0;i<4;i++){const col=i%2,row=Math.floor(i/2);const x=col?80:540,y=row*400;
 h+=`<div style="position:absolute;right:${x}px;top:${y}px;width:380px;text-align:center;perspective:1200px">
 <div id="f${i}" style="position:relative;width:260px;height:260px;margin:0 auto;transform-style:preserve-3d">
  <div style="position:absolute;inset:0;border-radius:50%;padding:8px;border:4px solid #DDD;background:#fff;backface-visibility:hidden"><div style="width:100%;height:100%;border-radius:50%;background:${OLD[i][0]};position:relative;overflow:hidden"><div style="position:absolute;left:10%;top:52%;width:80%;height:60%;border-radius:50%;background:rgba(255,255,255,.45)"></div><div style="position:absolute;left:32%;top:18%;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.18)"></div></div></div>
  <div style="position:absolute;inset:0;border-radius:50%;padding:8px;border:4px solid ${LI};background:${CR};backface-visibility:hidden;transform:rotateY(180deg)"><svg width="100%" height="100%" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="${GR}"/>${ICON[NEW[i][0]](LI)}</svg></div>
 </div>
 <div style="position:relative;height:64px;margin-top:20px"><div id="lo${i}" style="position:absolute;inset:0;font:500 46px/64px 'IBM Plex Sans Arabic';color:#8A8A8A">${OLD[i][1]}</div><div id="ln${i}" style="position:absolute;inset:0;font:700 46px/64px 'IBM Plex Sans Arabic';opacity:0">${NEW[i][1]}</div></div></div>`}
document.getElementById('hl').innerHTML=h;
document.getElementById('bioB').innerHTML=bio(0);document.getElementById('bioA').innerHTML=bio(1);
document.getElementById('row').firstElementChild.innerHTML='';

const E=t=>t<=0?0:t>=1?1:1-Math.pow(1-t,3);
const P=(t,a,d)=>E((t-a)/d);
const $=id=>document.getElementById(id);
const SC=[['s1',0,2.45],['s2',2.45,6.45],['s3',6.45,12.42],['s4',12.42,18.03],['s5',18.03,25.70],['s6',25.70,30.17],['s7',30.17,34.6],['s8',34.6,99]];
const FL=[21.33,22.17,23.22,24.26];
function frame(t){
 for(const [id,a,b] of SC){const o=Math.min(P(t,a,.22),1-P(t,b-.18,.18));$(id).style.opacity=o;$(id).style.display=o>0.001?'block':'none'; if(id==='s8')$(id).style.display=o>0.001?'flex':'none'}
 const cdv=t<2.45?null:t<6.45?4:t<12.42?3:t<18.03?2:t<25.70?1:t<30.17?0:null;
 $('cd').style.opacity=cdv===null?0:1;$('cd').textContent='0:0'+(cdv??0);
 $('wm').style.opacity=t<34.6?1:1-P(t,34.6,.2);
 // S1
 const k=P(t,.37,.25);$('five').style.transform=`scale(${1.35-0.35*k})`;$('five').style.opacity=k;
 $('s1t').style.clipPath=`inset(0 0 0 ${100-100*P(t,1.15,.7)}%)`;
 // S2
 $('s2a').style.opacity=P(t,2.64,.3);$('s2a').style.transform=`translateY(${40-40*P(t,2.64,.3)}px)`;
 $('s2b').style.opacity=P(t,4.6,.25);$('s2b').style.transform=`translateY(${40-40*P(t,4.6,.25)}px)`;
 const c=P(t,5.68,.2),off=P(t,6.0,.4);$('s2c').style.opacity=c*(1-off);$('s2c').style.transform=`translateX(${-700*off}px)`;
 // S3
 const sw=P(t,11.55,.45);$('bioB').style.opacity=1-sw;$('bioA').style.opacity=sw;
 [['c1',8.95],['c2',10.64],['c3',11.25]].forEach(([id,a])=>{const p=P(t,a,.25);$(id).style.opacity=p;$(id).style.transform=`scale(${.6+.4*p})`});
 // S4
 const sh=P(t,14.9,1.0),gr=P(t,17.0,.5);let sz=460-388*sh;if(t>=17.0)sz=72+228*gr;
 const av=$('av');const mode=t<16.9?'m':'l';
 if(av.dataset.m!==mode+Math.round(sz)){av.innerHTML=mode==='m'?messy(sz):mark(sz);av.dataset.m=mode+Math.round(sz)}
 av.style.width=av.style.height=sz+'px';
 const cx=t<17.0? (540+(1000-42-540)*sh) : (958-418*gr); const cy=t<17.0?(920+0*sh):920;
 av.style.right=(1080-cx-sz/2)+'px';av.style.top=(cy-sz/2)+'px';
 $('row').style.opacity=P(t,15.4,.3)*(1-P(t,16.95,.2));
 $('s4t').style.opacity=P(t,16.64,.25)*(1-P(t,17.0,.2));
 // S5
 $('s5t').style.opacity=P(t,19.3,.3);
 FL.forEach((a,i)=>{const p=P(t,a,.45);$('f'+i).style.transform=`rotateY(${180*p}deg)`;$('lo'+i).style.opacity=1-P(t,a,.2);$('ln'+i).style.opacity=P(t,a+.2,.25)});
 // S6
 $('s6a').style.opacity=P(t,25.95,.3);
 $('w1').style.opacity=P(t,27.98,.2);$('w1').style.transform=`translateY(${-60+60*P(t,27.98,.2)}px)`;
 $('w2').style.opacity=P(t,28.45,.2);$('w2').style.transform=`translateY(${-60+60*P(t,28.45,.2)}px)`;
 $('s6c').style.opacity=P(t,28.9,.3);
 // S7
 $('s7a').style.opacity=P(t,30.4,.3);$('s7a').style.transform=`translateY(${40-40*P(t,30.4,.3)}px)`;
 $('s7b').style.opacity=P(t,32.37,.25);$('s7c').style.opacity=P(t,33.36,.2);$('s7c').style.transform=`scale(${.8+.2*P(t,33.36,.2)})`;$('s7d').style.opacity=P(t,33.75,.25);
 // ONE gold element: the scan line
 let s={o:0,x:80,y:0,w:0};
 if(t<2.45) s={o:P(t,.5,.2),x:240,y:1260,w:600*P(t,.5,.5)};
 else if(t<6.45) s={o:P(t,4.6,.2),x:1000-620,y:1030,w:620*P(t,4.6,.4)};
 else if(t<12.42){const sweep=P(t,7.62,.9);s={o:1,x:80,y:470+440*sweep,w:920}}
 else if(t<18.03){const r=parseFloat(av.style.width);s={o:1,x:cx-r/2,y:cy+r/2+30,w:r}}
 else if(t<25.70){let i=-1;FL.forEach((a,j)=>{if(t>=a)i=j});if(i<0)s={o:P(t,19.3,.3),x:1000-640,y:570,w:640*P(t,19.3,.4)};else{const col=i%2,row=Math.floor(i/2);const right=col?80:540;s={o:1,x:1080-right-380+60,y:640+row*400+360,w:260}}}
 else if(t<30.17) s={o:P(t,27.98,.2),x:1000-700,y:950,w:700*P(t,27.98,.6)};
 else if(t<34.6){ if(t<33.36) s={o:P(t,30.4,.3),x:1000-560,y:900,w:560*P(t,30.6,.5)}; else s={o:1,x:1000-560,y:1250,w:560}}
 const sc=$('scan');const so=t<34.6?s.o*(1-P(t,34.45,.15)):0;sc.style.opacity=so;sc.style.left=s.x+'px';sc.style.top=s.y+'px';sc.style.width=Math.max(0,s.w)+'px';
}
window.frame=frame;
</script></body></html>
