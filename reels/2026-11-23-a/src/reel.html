<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../tools/reel-base.css">
<style>
#amb{position:absolute;inset:-120px;background:url(street.jpg) center/cover;filter:blur(80px) brightness(.26) saturate(1.1);opacity:.9}
#lab{top:120px}
#ttl{position:absolute;left:0;top:162px;width:1080px;height:110px;z-index:20}
.h{position:absolute;left:0;top:0;width:1080px;text-align:center;direction:rtl;font-weight:700;font-size:78px;line-height:1.2;white-space:nowrap;opacity:0}
.h .n{font-family:Inter;font-weight:700;color:var(--gold);font-size:54px;letter-spacing:2px;margin-left:22px;vertical-align:10px}
#card{position:absolute;left:220px;top:300px;width:640px;height:800px;border-radius:34px;overflow:hidden;z-index:10;
 box-shadow:0 60px 120px rgba(0,0,0,.7),0 0 0 1.5px rgba(255,255,255,.10),0 0 90px rgba(230,184,76,.08)}
.poster{position:absolute;left:0;top:0;width:640px;height:800px;overflow:hidden;transform-origin:0 0;background:#222}
.ph{position:absolute;left:0;top:0;width:1280px;height:960px;transform-origin:0 0}
.ph img{position:absolute;left:0;top:0;width:1280px;height:960px}
.blurL{position:absolute;inset:0}
.blurL .ph img{filter:blur(16px) brightness(.82) saturate(.9)}
.grad{position:absolute;left:0;bottom:0;width:640px;height:0;background:linear-gradient(0deg,rgba(6,6,8,.94) 0%,rgba(6,6,8,.82) 38%,rgba(6,6,8,0) 100%)}
.hd{position:absolute;left:0;width:640px;text-align:center;direction:rtl;color:#fff;white-space:nowrap}
.hd b{display:block;font-weight:600;font-size:64px;line-height:1.15}
.hd i{display:block;font-style:normal;font-weight:500;font-size:30px;margin-top:6px}
.hd.stroke b,.hd.stroke i{-webkit-text-stroke:9px #111;paint-order:stroke fill}
.wm{position:absolute;left:28px;top:26px;font:700 26px Plex;color:#fff;direction:rtl}
#rim{position:absolute;inset:0;border-radius:34px;z-index:30;pointer-events:none;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.16),inset 0 0 0 1.5px rgba(230,184,76,.16)}
.ring2{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:6px solid var(--bad);box-shadow:0 0 24px rgba(255,90,82,.7),inset 0 0 18px rgba(255,90,82,.35);opacity:0;z-index:25}
#bad{position:absolute;left:70px;top:236px;width:500px;height:190px;border-radius:26px;border:6px solid var(--bad);box-shadow:0 0 30px rgba(255,90,82,.6);opacity:0;z-index:26}
#bf{position:absolute;border-radius:26px;border:5px solid var(--gold);box-shadow:0 0 26px rgba(230,184,76,.7);opacity:0;z-index:26}
#xx{position:absolute;left:170px;top:180px;width:300px;height:300px;opacity:0;z-index:27}
#xx path{stroke:var(--bad);stroke-width:30;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 14px rgba(255,90,82,.8))}
.tick{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:var(--ok);color:#0C0C0E;font:700 54px Inter;display:flex;align-items:center;justify-content:center;opacity:0;z-index:28;box-shadow:0 0 0 10px rgba(69,212,131,.22),0 14px 30px rgba(0,0,0,.55)}
#arrow{position:absolute;left:560px;top:420px;width:56px;height:300px;opacity:0;z-index:27}
.tag{position:absolute;z-index:29;direction:rtl;font-weight:700;font-size:44px;padding:12px 34px;border-radius:999px;white-space:nowrap;opacity:0;background:rgba(23,19,10,.94)}
#tgOld{border:2px solid var(--bad);color:var(--bad)}
#tgBlur{border:2px solid var(--gold);color:var(--gold)}
#tgLost{border:2px solid var(--bad);color:var(--bad)}
#row{position:absolute;left:0;top:330px;width:1080px;height:420px;z-index:12}
.mini{position:absolute;top:0;width:300px;height:375px;border-radius:24px;overflow:hidden;opacity:0;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1.5px rgba(255,255,255,.12)}
.mini .poster{transform:scale(.46875)}
.mnum{position:absolute;left:50%;top:395px;margin-left:-45px;width:90px;text-align:center;font:700 40px Inter;color:var(--gold);opacity:0}
.mok{position:absolute;right:12px;top:12px;width:64px;height:64px;border-radius:50%;background:var(--ok);color:#0C0C0E;font:700 36px Inter;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.5)}
#cbtn{position:absolute;left:270px;top:840px;width:540px;height:104px;border-radius:999px;background:var(--gold);display:flex;align-items:center;justify-content:center;gap:18px;opacity:0;z-index:20;
 color:#17130A;font-weight:700;font-size:44px;direction:rtl;box-shadow:0 20px 50px rgba(230,184,76,.25)}
#capbox{top:1488px}
#mark{left:60px;top:74px;width:84px}
</style></head><body>
<div id="bg"></div><div id="amb"></div><div id="dots"></div>
<div id="stage">
 <div id="lab">T E X T &nbsp; O N &nbsp; <b>P H O T O</b></div>

 </div>
 <div id="card">
  <div class="poster" id="P">

  <div class="ring2" id="k3" style="left:102px;top:555px"></div><div class="ring2" id="k4" style="left:284px;top:100px"></div><div class="ring2" id="k5" style="left:560px;top:360px"></div>
  <div id="bad"></div><div id="bf"></div>
  <svg id="xx" viewBox="0 0 300 300"><path d="M50 50 L250 250 M250 50 L50 250"/></svg>

  <div class="tick" id="t1" style="left:570px;top:610px">✓</div>
  <div class="tick" id="t2" style="left:560px;top:540px">✓</div>
  <div class="tick" id="t3" style="left:560px;top:230px">✓</div>
  <div class="tag" id="tgLost" style="left:150px;top:440px">محد قراه</div>
  <div class="tag" id="tgBlur" style="left:140px;top:450px">بس ورا الكلام</div>

 </div>

 </div>
 <div id="cbtn"><svg width="54" height="54" viewBox="0 0 24 24"><path d="M12 3.5c-4.9 0-8.5 3.3-8.5 7.6 0 2.2 1 4.2 2.6 5.6L5.4 20.5l4.3-2c.7.2 1.5.3 2.3.3 4.9 0 8.5-3.3 8.5-7.6S16.9 3.5 12 3.5z" fill="#17130A"/></svg>اكتب لي بالتعليقات</div>
 <img id="mark" class="abs" src="mark.svg">
</div>

<script src="../../../tools/reel-engine.js"></script>
<script>
const DUR=28.68;
const CAP=[
 {a:0.0,w:[['شوف',0.0],['البوستر…',0.56,1]]},
 {a:1.4,w:[['الكلام',1.4],['موجود،',1.9],['بس',2.38],['محد',2.64],['قراه',2.86,1]]},
 {a:3.42,w:[['الصورة',3.42],['زحمة',4.22,1]]},
 {a:4.74,w:[['والكلام',4.74],['ضاع',5.28,1],['فيها',5.52]]},
 {a:6.42,w:[['أول',6.42],['حل:',6.8,1],['دوّر',7.28],['مكان',7.58],['هادي',7.94,1]]},
 {a:8.32,w:[['بالصورة،',8.32],['وحط',8.86],['الكلام',9.2],['فيه',9.64]]},
 {a:10.36,w:[['ثاني',10.36],['حل:',10.72,1],['تدرج',11.36,1],['غامق',12.02]]},
 {a:12.72,w:[['تحت',12.72],['الكلام،',13.24]]},
 {a:14.06,b:15.95,w:[['يطلع',14.06],['من',14.56],['تحت',14.72],['لفوق',15.08,1]]},
 {a:16.05,w:[['ثالث',16.05],['حل:',16.44,1],['ضبّب',17.12,1],['الصورة',17.62]]},
 {a:18.24,w:[['ورا',18.24],['الكلام',18.66],['بس',19.06,1]]},
 {a:19.5,b:20.45,w:[['مو',19.56],['كلها',19.76,1]]},
 {a:20.62,w:[['وستروك',20.62,1],['حول',21.22],['الحروف؟',21.54]]},
 {a:22.32,b:24.15,w:[['لا،',22.32,1],['يبين',23.1],['قديم',23.6,1]]},
 {a:24.28,w:[['انت',24.28],['شنو',24.84],['تستخدم؟',25.06,1]]},
 {a:25.76,b:28.6,w:[['اكتب',25.76],['لي',26.18],['بالتعليقات',26.26,1]]}];
// crop [t,cx,cy,w] in photo px (h=w*1.25)
const CROP=[[0,640,540,760],[0.6,640,520,704],[6.3,640,520,704],[6.9,640,520,704],[10.2,640,520,704],[16,640,505,680],[20.4,640,520,704],[28.7,640,520,690]];
function setCrop(el,cx,cy,w,W=640){const s=W/w,h=w*1.25;el.style.transform=`translate(${-(cx-w/2)*s}px,${-(cy-h/2)*s}px) scale(${s})`;}
// headline y (centre, card px) over time
const HY=[[0,300],[6.9,300],[7.2,330],[7.9,712],[10.2,712],[10.6,600],[15.9,600],[16.2,330],[28.7,330]];
function buildMini(id,v){const m=$(id);m.innerHTML=`<div class="poster"><div class="ph"><img src="street.jpg"></div>${v==3?'<div class="blurL" style="clip-path:inset(236px 52px 374px 52px round 26px)"><div class="ph"><img src="street.jpg"></div></div>':''}${v==2?'<div class="grad" style="height:500px"></div>':''}<div class="wm">فنار</div><div class="hd" style="top:${(v==1?712:v==2?600:330)-62}px"><b>افتتاح فنار</b><i>الخميس · 7 المسا</i></div></div><div class="mok">✓</div>`;
 m.querySelectorAll('.ph').forEach(p=>setCrop(p,640,520,704));}
function init(){mkCaps(CAP);[1,2,3].forEach(v=>buildMini('m'+v,v));}
function hh(id,t,a,b){S(id,pop(t,a,b,{dy:30,s0:.92}));}
function frame(t){
 caps(t,CAP);
 $('fade').style.opacity=1-eo(P(t,0,.3))+ein(P(t,DUR-.45,.45));
 const cs=1+.012*Math.sin(t*.35);$('stage').style.transform=`translate(${540-540*cs}px,${700-700*cs}px) scale(${cs})`;
 // card in / out (zoom out to the row at 24.28)
 const cin=back(P(t,0,.6)),cout=ein(P(t,24.15,.35));
 $('card').style.opacity=cl(cin*2)*(1-cout);$('card').style.transform=`translateY(${lerp(70,0,cin)-cout*40}px) scale(${lerp(.9,1,cin)*(1-cout*.25)})`;
 let bl=(1-cl(P(t,0,.45)))*14+cout*16;
 // whip between solutions
 let wb=0;[6.42,10.36,16.05,20.62].forEach(x=>{const d=Math.abs(t-x);if(d<.2)wb=Math.max(wb,1-d/.2);});
 bl+=wb*12;$('card').style.filter=bl>.3?`blur(${bl.toFixed(1)}px)`:'';
 const [cx,cy,cw]=keysE(t,CROP);setCrop($('ph'),cx,cy,cw);setCrop($('ph2'),cx,cy,cw);
 // headline
 const [hy]=keysE(t,HY);const hd=$('hd');hd.style.top=(hy-62)+'px';
 const shk=(t>4.22&&t<5.0)?Math.sin(t*60)*5*(1-P(t,4.22,.78)):0;hd.style.transform=`translateX(${shk}px)`;
 hd.classList.toggle('stroke',t>=20.75&&t<24.3);
 // red frame on «محد قراه» + tag
 const bo=cl(P(t,2.6,.2))*(1-cl(P(t,6.2,.25)));$('bad').style.opacity=bo;$('bad').style.top=(hy-95)+'px';
 const tl=pop(t,2.86,6.2,{dy:30,s0:.7});S('tgLost',tl);
 // busy spots light up on «زحمة»
 ['k1','k2','k3','k4','k5'].forEach((k,i)=>{const p=P(t,4.22+i*.12,.3);const o=cl(p*3)*(1-cl(P(t,6.1,.25)));const e=$(k);e.style.opacity=o;e.style.transform=`scale(${lerp(.3,1,back(p))*(1+.06*Math.sin(t*12+i))})`;});
 // 01 tick on «هادي»/«حط»
 S('t1',pop(t,8.86,10.2,{dy:20,s0:.3}));
 // 02 gradient: under the text on «تدرج», rises on «يطلع من تحت لفوق»
 const g1=ee(P(t,11.36,.9)),g2=ee(P(t,14.06,1.3)),gOut=cl(P(t,15.95,.3));$('grad').style.height=((g1*300+g2*220)*(1-gOut))+'px';
 const ap=P(t,14.06,1.1);$('arrow').style.opacity=(ap>0?cl(ap*4):0)*(1-cl(P(t,15.7,.25)));$('arrow').style.transform=`translateY(${lerp(80,-20,eo(ap))}px)`;
 S('t2',pop(t,13.24,15.95,{dy:20,s0:.3}));
 // 03 blur only behind the text, grows on «ضبّب»
 const bp=ee(P(t,17.12,.8)),bOut=cl(P(t,20.3,.25));const bw=bp*268,bh=bp*95;
 const top=hy-bh,bot=800-(hy+bh),lr=320-bw;
 $('blurL').style.opacity=bp>0?(1-bOut):0;$('blurL').style.clipPath=`inset(${top}px ${lr}px ${bot}px ${lr}px round 26px)`;
 Object.assign($('bf').style,{left:lr+'px',top:top+'px',width:(2*bw)+'px',height:(2*bh)+'px',opacity:bp>.05?(1-bOut)*cl(P(t,17.4,.3)):0});
 const tb=pop(t,19.06,20.3,{dy:30,s0:.7});S('tgBlur',tb);$('tgBlur').style.top=(hy+bh+24)+'px';
 S('t3',pop(t,19.06,20.3,{dy:20,s0:.3}));
 // stroke → red cross on «لا», tag «قديم»
 const xp=P(t,22.32,.35);$('xx').style.opacity=(xp>0?1:0)*(1-cl(P(t,24.1,.2)));$('xx').style.strokeDasharray='300';
 [...$('xx').querySelectorAll('path')].forEach(p=>{p.style.strokeDasharray='600';p.style.strokeDashoffset=600*(1-eo(xp));});
 S('tgOld',pop(t,23.6,24.15,{dy:30,s0:.7}));
 // titles
 hh('h0',t,1.4,6.2);hh('h1',t,6.8,10.2);hh('h2',t,10.72,15.9);hh('h3',t,16.44,20.4);hh('h4',t,20.62,24.15);hh('h5',t,24.4);
 // ending: 3 fixed versions + button
 ['m1','m2','m3'].forEach((m,i)=>S(m,pop(t,24.4+i*.16,undefined,{dy:60,s0:.8})));
 const cb=pop(t,25.76,undefined,{dy:40,s0:.6});cb.s*=1+.03*Math.sin(Math.max(0,t-26.5)*6)*cl(P(t,26.5,.3));S('cbtn',cb);
 S('mark',{o:.6*cl(P(t,.4,.6))});
}
</script></body></html>
