<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>
.ab{position:relative;overflow:hidden;margin:20px}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.pat{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;font-family:Mont;font-weight:700;letter-spacing:.34em;direction:ltr;white-space:nowrap}
body{background:transparent}</style></head><body>{SYM}
<!-- window-ledge cup: slate wrap, 180deg of the cup -->
<div class="ab" id="cup_slate" data-shot style="width:2200px;height:1900px;background:var(--slate)">
  <svg class="pat" style="top:auto;height:330px;bottom:0"><rect width="100%" height="100%" fill="url(#pat-slate)"/></svg>
  <div style="position:absolute;left:0;right:0;bottom:330px;height:10px;background:var(--tan)"></div>
  <div class="lk vert ctr" style="width:520px;top:42%;--a:var(--cream);--b:var(--tan)"><i class="a"></i><i class="b"></i></div>
</div>
<!-- cream cup art (transparent bg, cup is tinted cream by the mockup) -->
<div class="ab" id="cup_cream" data-shot style="width:2000px;height:1500px">
  <svg class="ic ctr" style="width:560px;top:45%"><use href="#ic"/></svg>
  <div class="tag" style="left:50%;bottom:150px;transform:translateX(-50%);font-size:44px;color:var(--brown)">LEAVE A MARK</div>
</div>
<!-- espresso machine cup: tan band -->
<div class="ab" id="cup_tan" data-shot style="width:1346px;height:1700px;background:var(--cream)">
  <div style="position:absolute;inset:auto 0 0 0;height:42%;background:var(--brown)"></div>
  <svg class="pat" style="top:auto;height:42%;bottom:0"><rect width="100%" height="100%" fill="url(#pat-brown)"/></svg>
  <div class="lk vert ctr" style="width:330px;top:36%;--a:var(--ink);--b:var(--brown)"><i class="a"></i><i class="b"></i></div>
</div>
<!-- sign: square -->
<div class="ab" id="sign" data-shot style="width:1400px;height:1400px;background:var(--slate)">
  <div class="lk vert ctr" style="width:520px;--a:var(--cream);--b:var(--tan)"><i class="a"></i><i class="b"></i></div>
</div>
<!-- bags -->
<div class="ab" id="bag_a" data-shot style="width:1500px;height:2100px;background:var(--slate)">
  <svg class="ic ctr" style="width:620px;top:44%;--a:var(--cream);--b:var(--tan)"><use href="#ic"/></svg>
  <div class="lk word" style="position:absolute;width:300px;left:50%;bottom:150px;transform:translateX(-50%);--a:var(--cream);--b:var(--tan)"><i class="a"></i><i class="b"></i></div>
</div>
<div class="ab" id="bag_b" data-shot style="width:1500px;height:1640px;background:var(--cream)">
  <svg class="pat" style=""><rect width="100%" height="100%" fill="url(#pat-cream)"/></svg>
  <div style="position:absolute;inset:27% 22%;background:var(--cream)"></div>
  <div class="lk vert ctr" style="width:400px"><i class="a"></i><i class="b"></i></div>
</div>
<!-- coffee pouch front + side (kraft shows through: transparent bg, label only) -->
<div class="ab" id="pouch_f" data-shot style="width:1500px;height:2500px">
  <div style="position:absolute;left:14%;right:14%;top:27%;bottom:14%;background:var(--slate);border-radius:26px">
    <svg class="ic" style="width:42%;margin:13% auto 0;--a:var(--cream);--b:var(--tan)"><use href="#ic"/></svg>
    <div class="lk word" style="width:46%;margin:7% auto 0;--a:var(--cream);--b:var(--tan)"><i class="a"></i><i class="b"></i></div>
    <div style="position:absolute;left:9%;right:9%;bottom:19%;height:4px;background:var(--tan)"></div>
    <div class="ku" style="position:absolute;left:0;right:0;bottom:10.5%;text-align:center;color:var(--cream);font-size:66px;font-weight:700">تحميص وسط</div>
    <div class="tag" style="left:0;right:0;bottom:5%;text-align:center;font-size:30px;color:var(--tan)">MEDIUM ROAST · 250 G</div>
  </div>
</div>
<div class="ab" id="pouch_s" data-shot style="width:300px;height:2500px">
  <div class="tag" style="left:50%;top:55%;transform:translate(-50%,-50%) rotate(90deg);font-size:56px;color:var(--slate)">LEAVE A MARK</div>
</div>
<!-- apron: art only, apron tinted by the mockup -->
<div class="ab" id="apron" data-shot style="width:1500px;height:1590px">
  <svg class="ic ctr" style="width:300px;top:30%;--a:var(--cream);--b:var(--tan)"><use href="#ic"/></svg>
</div>
<div class="ab" id="aprontag" data-shot style="width:600px;height:840px;background:var(--cream)">
  <svg class="ic ctr" style="width:300px"><use href="#ic"/></svg>
</div>
<!-- sticker -->
<div class="ab" id="sticker" data-shot style="width:1066px;height:1066px;background:var(--slate)">
  <svg class="ic ctr" style="width:400px;top:48%;--a:var(--cream);--b:var(--tan)"><use href="#ic"/></svg>
  <svg viewBox="0 0 1066 1066" style="position:absolute;inset:0"><path id="arc" d="M133 533a400 400 0 0 1 800 0" fill="none"/><path id="arc2" d="M113 533a420 420 0 0 0 840 0" fill="none"/>
  <text font-family="Mont" font-weight="700" font-size="46" letter-spacing="14" fill="#C6AC8F" text-anchor="middle"><textPath href="#arc" startOffset="50%">MARK COFFEE</textPath></text>
  <text font-family="Mont" font-weight="700" font-size="40" letter-spacing="14" fill="#C6AC8F" text-anchor="middle"><textPath href="#arc2" startOffset="50%">LEAVE A MARK</textPath></text></svg>
</div>
<!-- tote -->
<div class="ab" id="tote" data-shot style="width:1500px;height:1680px">
  <div class="lk vert ctr" style="width:560px;top:48%;--a:var(--slate);--b:var(--brown)"><i class="a"></i><i class="b"></i></div>
</div>
<!-- menu board 2769x1870 -->
<div class="ab" id="menu" data-shot style="width:2769px;height:1870px;background:var(--slate);color:var(--cream);direction:rtl">
  <svg class="pat" style="left:0;width:27%"><rect width="100%" height="100%" fill="url(#pat-slate)"/></svg>
  <div style="position:absolute;left:0;width:27%;top:0;bottom:0;display:grid;place-items:center"><div class="lk vert" style="width:440px;--a:var(--cream);--b:var(--tan)"><i class="a"></i><i class="b"></i></div></div>
  <div style="position:absolute;right:130px;left:31%;top:110px;bottom:110px;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><div class="ku" style="font-size:190px;line-height:1.1">المنيو</div><div class="en" style="font-size:50px;color:var(--tan)">MENU</div></div>
    <div class="mn" style="margin-top:50px;display:grid;grid-template-columns:1fr 1fr;gap:40px 120px;font-family:Taj;font-size:104px;font-weight:500;flex:1;align-content:space-evenly">
      <div><b>إسبريسو</b><span>1.000</span></div><div><b>لاتيه</b><span>1.750</span></div>
      <div><b>كورتادو</b><span>1.500</span></div><div><b>سبانش لاتيه</b><span>2.000</span></div>
      <div><b>فلات وايت</b><span>1.750</span></div><div><b>كولد برو</b><span>2.000</span></div>
    </div>
    <div style="border-top:5px solid var(--tan);padding-top:36px;font-size:84px;color:var(--tan);font-family:Taj;font-weight:500">كل كوب… يخلّي علامة.</div>
  </div>
  <style>.mn div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px dashed #47606b;padding-bottom:26px}.mn b{font-weight:500}.mn span{font-family:Mont;font-weight:700;color:var(--tan);font-size:84px;direction:ltr}</style>
</div>

<!-- v2 cup art: 2000 wide = half the cup's circumference, transparent -->
<div class="ab" id="cup_hand" data-shot style="width:2000px;height:2400px">
  <div class="lk vert ctr" style="width:640px;--a:var(--cream);--b:var(--tan)"><i class="a"></i><i class="b"></i></div>
</div>
<div class="ab" id="cup_esp" data-shot style="width:2000px;height:2400px">
  <div class="lk vert ctr" style="width:560px;--a:var(--ink);--b:var(--brown)"><i class="a"></i><i class="b"></i></div>
</div>
<div class="ab" id="cup_to" data-shot style="width:2000px;height:2400px">
  <svg class="ic ctr" style="width:560px;top:46%"><use href="#ic"/></svg>
  <div class="tag" style="left:50%;top:66%;transform:translateX(-50%);font-size:46px;color:var(--brown)">LEAVE A MARK</div>
</div>
<div class="ab" id="sign2" data-shot style="width:1468px;height:1468px;background:var(--slate)">
  <svg class="ic ctr" style="width:640px;--a:var(--cream);--b:var(--tan)"><use href="#ic"/></svg>
</div>
<div class="ab" id="apron2" data-shot style="width:1500px;height:1600px">
  <svg class="ic ctr" style="width:380px;top:30%;--a:var(--cream);--b:var(--tan)"><use href="#ic"/></svg>
</div>
</body></html>
