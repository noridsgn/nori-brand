<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:500;src:url(ibm-plex-sans-arabic-arabic-500-normal.woff2);unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:P;font-weight:700;src:url(ibm-plex-sans-arabic-arabic-700-normal.woff2);unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:P;font-weight:500;src:url(ibm-plex-sans-arabic-latin-500-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:P;font-weight:700;src:url(ibm-plex-sans-arabic-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0C0C0E;--g:#E6B84C;--w:#F4F1EA;--m:#8A8780;--M:80px}
html,body{overflow:hidden}
.cv{position:relative;width:1080px;height:1440px;background:radial-gradient(120% 80% at 85% 0%,#2a2214 0%,#121114 45%,#0C0C0E 75%);font-family:P,sans-serif;color:var(--w);overflow:hidden}
/* back scene */
.ghost{position:absolute;left:-40px;top:860px;font-size:560px;font-weight:700;color:#E6B84C;opacity:.22;filter:blur(18px);direction:ltr;letter-spacing:-.05em;line-height:1}
.beam{position:absolute;left:-200px;top:-200px;width:1500px;height:520px;background:linear-gradient(180deg,rgba(230,184,76,0) 0%,rgba(230,184,76,.10) 50%,rgba(230,184,76,0) 100%);transform:rotate(28deg);filter:blur(30px)}
.scr{position:absolute;border-radius:18px;filter:blur(22px)}
.s1{left:-80px;top:1080px;width:420px;height:260px;background:#1d2a33;opacity:.8}
.s2{right:-120px;top:980px;width:380px;height:300px;background:#2b2416;opacity:.8}
.dot{position:absolute;border-radius:50%;filter:blur(8px)}
/* corner labels */
.lab{position:absolute;font-size:20px;font-weight:500;letter-spacing:.42em;color:rgba(244,241,234,.6);direction:ltr;line-height:1.9}
.lab.tl{left:var(--M);top:72px}
.lab.tr{right:var(--M);top:72px;text-align:right;border-right:2px solid var(--g);padding-right:18px}
.lab .u{display:block;width:44px;height:2px;background:var(--g);margin-top:14px}
.lab.br{right:var(--M);bottom:64px;text-align:right}
/* window */
.win{position:absolute;left:96px;right:96px;top:262px;height:930px;border-radius:40px;
 background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.035) 40%,rgba(255,255,255,.06));
 border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(28px) saturate(140%);
 box-shadow:0 60px 120px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.bar{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1.5px solid rgba(255,255,255,.10)}
.dots{display:flex;gap:12px;direction:ltr}
.dots i{width:18px;height:18px;border-radius:50%;background:rgba(244,241,234,.22)}
.dots i:first-child{background:var(--g)}
.wt{font-size:24px;font-weight:500;color:rgba(244,241,234,.6)}
.ham{width:34px;height:14px;border-top:2px solid rgba(244,241,234,.5);border-bottom:2px solid rgba(244,241,234,.5)}
/* folder */
.fold{position:absolute;left:44px;right:44px;top:128px;height:590px}
.tab{z-index:1;position:absolute;right:0;top:0;width:360px;height:74px;border-radius:28px 28px 0 0;background:#F4F1EA;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tab b{font-size:25px;font-weight:700;color:#0C0C0E}
.tab span{font-size:21px;font-weight:500;color:#9a7a2a}
.body{position:absolute;left:0;right:0;top:72px;bottom:0;z-index:-0;background:#F4F1EA;border-radius:34px 0 34px 34px;padding:56px 56px 0;color:#0C0C0E;
 box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 -2px 0 rgba(0,0,0,.06)}
.tag{display:inline-block;background:#0C0C0E;color:var(--g);font-size:28px;font-weight:700;padding:6px 26px 12px;border-radius:40px}
.hl{margin-top:28px;font-size:66px;font-weight:700;line-height:1.3}
.hl .lt{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.hl .g{color:#B8862A}
.dek{margin-top:22px;font-size:30px;font-weight:500;line-height:1.6;color:#55524c}
.lt2{direction:ltr;unicode-bidi:isolate}
/* facts pill */
.facts{position:absolute;left:44px;right:44px;top:750px;height:120px;border-radius:30px;background:rgba(12,12,14,.55);border:1.5px solid rgba(255,255,255,.12);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}
.f{padding:0 34px}
.f+.f{border-right:1.5px solid rgba(255,255,255,.12)}
.k{font-size:21px;font-weight:500;color:var(--m)}
.v{font-size:32px;font-weight:700;margin-top:2px}
.v small{font-size:19px;font-weight:500;color:var(--m)}
.v.g{color:var(--g)}
</style></head><body><div class="cv">
<div class="beam"></div>
<div class="scr s1"></div><div class="scr s2"></div>
<div class="ghost">9</div>
<div class="lab tl">NORI<br>DESIGN<br>NEWS<span class="u"></span></div>
<div class="lab tr">19 . 11<br>2026</div>
<div class="win">
  <div class="bar"><div class="ham"></div><div class="wt">أخبار التصميم</div><div class="dots"><i></i><i></i><i></i></div></div>
  <div class="fold">
    <div class="tab"><b>برامج التصميم</b><span class="lt2">Canva</span></div>
    <div class="body">
      <div class="tag">( خبر )</div>
      <div class="hl"><span class="lt">Canva</span> صار فيها زر<br>يطفي <span class="g">9 أدوات</span><br>ذكاء اصطناعي مرة وحدة</div>
      <div class="dek">والزر متوفر لحسابات <span class="lt2">Free</span> و<span class="lt2">Pro</span> بدون أي تكلفة زيادة.</div>
    </div>
  </div>
  <div class="facts">
    <div class="f"><div class="k">الخطط</div><div class="v"><span class="lt2">Free · Pro</span></div></div>
    <div class="f"><div class="k">ينطفي · مثال</div><div class="v g"><span class="lt2">Magic Write</span></div></div>
    <div class="f"><div class="k">يبقى شغال</div><div class="v"><span class="lt2">Magic Grab</span></div></div>
  </div>
</div>
<div class="lab br">SOURCE · CANVA.COM</div>
</div></body></html>
